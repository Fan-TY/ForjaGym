<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Login_CSS.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <header>

    </header>

    <main class="container d-flex align-items-center justify-content-center vh-100">
        <div  class="row align-items-center justify-content-center w-100" >

            <section id="presentacion_inicial" class="col-6" >
                <h1> entrena sin límites</h1>
                <p>accede a tus planes, promociones y pagos en un solo lugar</p>
            </section>

            <section id="formulario" class="col-6 text-center">
                <input type="radio" name="opcion-radio" id="iniciar_sesion"  checked>iniciar sesion
                <input type="radio" name="opcion-radio" id="crear_sesion">crear sesión

            <!-- Formulario de inicio de sesion -->
                <div id="contenido1" class="contenido text-start">
                    <form action="" id="formulario_iniciar">
                        <label for="mail" class="form-label m-2">correo electrónico</label>
                        <input type="email" id="mail" name="user_email" placeholder="ejemplo@correo.com" class="form-control">

                        <label for="pass" class="form-label m-2" >contraseña</label>
                        <input type="password" id="pass" name="user_pass" placeholder="******" class="form-control">

                        <button type="submit" class="btn btn-primary w-100 mt-3">Ingresar</button>
                    </form>
                </div>

                    <!-- Formulario de registro-->
                <div id="contenido2" class="contenido text-start">
                    <form action="">
                        <label for="name" class="form-label m-2">Nombre de usuario</label>
                        <input type="text" name="user_name" id="name" placeholder="usuario" class="form-control">

                        <label for="DNI" class="form-label m-2">Número de DNI</label>
                        <input type="text" name="user_DNI" id="dni" placeholder="12345678" class="form-control">

                        <label for="mail_crear" class="form-label m-2">correo electrónico</label>
                        <input type="email" id="mail_crear" name="user_email" placeholder="ejemplo@correo.com" class="form-control">

                        <label for="pass_crear" class="form-label m-2">contraseña</label>
                        <input type="password" id="pass_crear" name="user_pass" placeholder="******" class="form-control">

                        <button type="submit"class="btn btn-primary w-100 mt-3" >Registrar</button>
                    </form>
                </div>
            </section>

        </div>


    </main>

    <footer>

    </footer>
    
</body>

</html>
