<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForjaGym - Crear Plan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css_empleados/miEstilo.css">
</head>

<body>

    <div class="container py-4">
        <div class="banner-section mb-4">
            <h2>Crear nuevo plan</h2>
            <p>Completa los datos para agregar un nuevo plan o servicio</p>
        </div>

        <div class="card border-0 shadow-sm p-4">
            <form>
                <div class="mb-3">
                    <label class="form-label">Nombre del plan</label>
                    <input type="text" class="form-control" placeholder="Ej: Fuerza Total">
                </div>
                <div class="mb-3">
                    <label class="form-label">Categoría</label>
                    <select class="form-select">
                        <option value="entrenamiento">Entrenamiento</option>
                        <option value="producto">Producto</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Precio (S/)</label>
                    <input class="form-control" placeholder="Ej: 180">
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Guardar plan</button>
                    <a href="suscripciones_empleados.html" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
